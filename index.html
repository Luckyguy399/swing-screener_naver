<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단타·스윙 스크리너</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2433;--sub:#6b7686;--line:#dde2ea;--up:#d7263d;--dn:#2b6cd9;--acc:#0f766e;--accbg:#d9f0ed;--warn:#b45309;--warnbg:#fdecc8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a24;--card:#1d2532;--ink:#e8edf5;--sub:#93a0b3;--line:#2c3646;--up:#ff6b7d;--dn:#6ea2ff;--acc:#4fd1c5;--accbg:#173a38;--warn:#f6c453;--warnbg:#3b2f12}}
:root[data-theme="dark"]{--bg:#141a24;--card:#1d2532;--ink:#e8edf5;--sub:#93a0b3;--line:#2c3646;--up:#ff6b7d;--dn:#6ea2ff;--acc:#4fd1c5;--accbg:#173a38;--warn:#f6c453;--warnbg:#3b2f12}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 2px;font-weight:700}
.note{font-size:12px;color:var(--warn);background:var(--warnbg);padding:6px 10px;border-radius:6px;margin:8px 0 12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.lk{background:transparent;color:var(--sub);border-style:dashed}
.chip:focus-visible,.row:focus-visible,#q:focus-visible,.mini:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#q{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
#res{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:4px 0 10px}
#res:empty{display:none}
.sr{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sr:last-child{border-bottom:0}
.sr i{font-style:normal;color:var(--sub);font-size:12px;margin-left:4px}
.add{color:var(--acc);font-weight:700;white-space:nowrap}.in{color:var(--sub);white-space:nowrap}
.list{border-top:1px solid var(--line)}
.row{background:var(--card);border-bottom:1px solid var(--line);padding:12px 12px 10px;cursor:pointer;display:block}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:16px}.cd{color:var(--sub);font-size:12px;margin-left:6px}
.chg{font-weight:700;font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}
.r2{display:flex;justify-content:space-between;gap:8px;margin-top:4px;font-size:12px;color:var(--sub)}
.theme{color:var(--acc);font-weight:500}.theme.nc{color:var(--sub)}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:9px}
.g{font-size:11px;color:var(--sub)}.g b{color:var(--ink);font-size:13px;margin-left:4px}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:3px;overflow:hidden}
.fill{height:100%;background:var(--acc);border-radius:3px}.fill.s{background:var(--dn)}
.tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--accbg);color:var(--acc)}
.tag.w{background:var(--line);color:var(--sub)}
.det{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px;line-height:1.7}
.row.open .det{display:block}
.det span{display:inline-block;margin:0 6px 4px 0;padding:2px 8px;border-radius:5px;border:1px solid var(--line)}
.det .on{border-color:var(--acc);color:var(--acc)}.det .off{color:var(--sub)}
.acts{margin-top:8px}
.mini{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);margin-right:6px;cursor:pointer}
.err{color:var(--warn);font-size:12px;margin-top:4px}
.empty{padding:22px;text-align:center;color:var(--sub);font-size:14px}
.foot{font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<h1>단타·스윙 스크리너</h1>
<div id="clock" style="font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums"></div>
<div class="note" id="st">시세 불러오는 중…</div>
<input id="q" type="search" placeholder="종목명 또는 6자리 코드로 검색" enterkeyhint="search" autocomplete="off">
<div id="res"></div>
<div class="bar" id="g"></div>
<div class="bar" id="f">
<button class="chip" data-f="all" aria-pressed="true">전체</button>
<button class="chip" data-f="day" aria-pressed="false">단타 적합</button>
<button class="chip" data-f="swing" aria-pressed="false">스윙 적합</button>
</div>
<div class="bar" id="s">
<button class="chip" data-s="best" aria-pressed="true">종합점수순</button>
<button class="chip" data-s="amt" aria-pressed="false">거래대금순</button>
<button class="chip" data-s="vr" aria-pressed="false">거래량증가순</button>
<button class="chip" data-s="cap" aria-pressed="false">시총순</button>
</div>
<div class="list" id="list"></div>
<div class="foot">점수 기준(100점) — 단타: 거래대금 30, 거래량 증가 30, 변동성(ATR) 20, 매물대 돌파 20. 스윙: 추세 35, 눌림·RSI 25, 테마강도 15, 돌파 15, 볼린저 위치 10. 70점 이상이면 적합으로 표시합니다.<br>그룹과 관심종목은 이 기기의 브라우저에 저장돼요. 폰과 PC는 서로 연동되지 않아요. 테마는 종목을 추가할 때 직접 입력하고, 종목을 펼쳐 수정할 수 있어요.</div>
</div>
<script>
const KEY='ss.groups.v1';
const SEED=[["095610","테스","반도체 소부장","전공정 · 증착장비"],["067310","하나마이크론","반도체 소부장","후공정 · 패키징(OSAT)"],["042700","한미반도체","반도체 소부장","후공정 · HBM TC본더"],["058470","리노공업","반도체 소부장","테스트 · 소켓/핀"],["058610","에스피지","로봇","액츄에이터 · 감속기"],["277810","레인보우로보틱스","로봇","휴머노이드 · 완제품"],["086520","에코프로","2차전지","양극재 · 소재"],["010140","삼성중공업","조선","조선 · LNG선"]].map(a=>({c:a[0],n:a[1],t:a[2],s:a[3]}));
let G=null;try{G=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!G||!G.groups||!G.groups[G.cur])G={cur:'기본',groups:{'기본':SEED}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtCap=v=>!v?'-':v>=10000?(v/10000).toFixed(1).replace(/\.0$/,'')+'조':v.toLocaleString()+'억';
const fmtAmt=v=>v>=10000?(v/10000).toFixed(1)+'조':v.toLocaleString()+'억';
function score(d){
 const day=(d.amt>=500?30:d.amt>=200?20:d.amt>=100?10:0)+(d.vr>=300?30:d.vr>=200?22:d.vr>=150?12:0)+(d.atr>=5?20:d.atr>=3?12:d.atr>=2?5:0)+(d.brk?20:0);
 const rsiOk=(d.rsi>=40&&d.rsi<=65)||d.rsi<=30;
 const sw=(d.trend===2?35:d.trend===1?18:0)+((d.pull&&rsiOk)?25:(rsiOk?12:0))+Math.round(d.ts*1.5)+(d.brk?15:0)+(d.pb>=.5&&d.pb<=1?10:d.pb<.1?6:0);
 return {day:Math.min(day,100),sw:Math.min(sw,100)};
}
let D=[],F='all',S='best',busy=0;const open=new Set();
const verdict=d=>{const a=d.sc.day>=70,b=d.sc.sw>=70;return a&&b?'단타 + 스윙 적합':a?'단타 적합':b?'스윙 적합':'관망'};
const rsiLabel=r=>r>=70?'과매수':r<=30?'과매도':'중립';
const pbLabel=p=>p>=1?'상단 돌파':p<=0.05?'하단 터치':p>=.8?'상단 근접':'밴드 내';
const st=document.getElementById('st');
function renderG(){
 document.getElementById('g').innerHTML=Object.keys(G.groups).map(n=>`<button class="chip" data-g="${esc(n)}" aria-pressed="${n===G.cur}">${esc(n)} ${G.groups[n].length}</button>`).join('')+'<button class="chip lk" data-a="new">+ 그룹</button><button class="chip lk" data-a="ren">이름 변경</button><button class="chip lk" data-a="delg">그룹 삭제</button>';
}
function render(){
 const ok=D.filter(d=>!d.err),bad=D.filter(d=>d.err);
 let L=ok.filter(d=>F==='all'||(F==='day'&&d.sc.day>=70)||(F==='swing'&&d.sc.sw>=70));
 L.sort((a,b)=>S==='best'?b.best-a.best:S==='amt'?b.amt-a.amt:S==='vr'?b.vr-a.vr:b.cap-a.cap);
 if(F==='all')L=L.concat(bad);
 const el=document.getElementById('list');
 if(!(G.groups[G.cur]||[]).length){el.innerHTML='<div class="empty">이 그룹은 비어 있어요. 위 검색창에서 종목을 추가해 보세요.</div>';return}
 if(!L.length){el.innerHTML='<div class="empty">조건에 맞는 종목이 없어요. 다른 필터를 선택해 보세요.</div>';return}
 const on=(x,t)=>`<span class="${x?'on':'off'}">${t}</span>`;
 el.innerHTML=L.map(d=>{
  const acts=`<div class="acts"><button class="mini" data-act="theme" data-c="${d.c}">테마 수정</button><button class="mini" data-act="del" data-c="${d.c}">삭제</button></div>`;
  const nc=!d.t||d.t==='미분류';
  if(d.err)return `<div class="row${open.has(d.c)?' open':''}" tabindex="0" role="button" data-c="${d.c}"><div class="r1"><div><span class="nm">${esc(d.n)}</span><span class="cd">${d.c}</span></div></div><div class="err">조회 실패: ${esc(d.err)}</div><div class="det">${acts}</div></div>`;
  const up=d.chg>=0,v=verdict(d);
  return `<div class="row${open.has(d.c)?' open':''}" tabindex="0" role="button" data-c="${d.c}">
  <div class="r1"><div><span class="nm">${esc(d.n)}</span><span class="cd">${d.c}</span></div>
  <div class="chg ${up?'up':'dn'}">${d.p.toLocaleString()}원 ${up?'+':''}${d.chg.toFixed(1)}%</div></div>
  <div class="r2"><div><span class="theme${nc?' nc':''}">${esc(nc?'테마 미분류':d.t)}</span>${d.s?' · '+esc(d.s):''}</div><div>시총 ${fmtCap(d.cap)}</div></div>
  <div class="sc">
   <div class="g">단타<b>${d.sc.day}</b><div class="track"><div class="fill" style="width:${d.sc.day}%"></div></div></div>
   <div class="g">스윙<b>${d.sc.sw}</b><div class="track"><div class="fill s" style="width:${d.sc.sw}%"></div></div></div>
  </div>
  <span class="tag ${v==='관망'?'w':''}">${v}</span>
  <div class="det">
   ${on(d.amt>=200,'거래대금 '+fmtAmt(d.amt))}${on(d.vr>=200,'거래량 평균 대비 '+d.vr+'%')}${on(d.brk,d.brk?'매물대 돌파':'돌파 없음')}
   ${on(d.trend===2,d.trend===2?'이평 정배열':d.trend===1?'20일선 위':'20일선 아래')}${on(d.rsi>=70||d.rsi<=30,'RSI '+d.rsi+' ('+rsiLabel(d.rsi)+')')}
   ${on(d.pb>=.8||d.pb<=.05,'볼린저 '+pbLabel(d.pb))}${on(d.atr>=4,'일 변동폭 약 '+d.atr+'%')}${on(d.pull,d.pull?'눌림목 구간':'눌림 아님')}${on(d.ts>=8,'테마 강도 '+d.ts+'/10')}
   ${acts}
  </div></div>`}).join('');
}
async function load(){
 const list=G.groups[G.cur]||[];
 if(!list.length){D=[];st.textContent='종목을 추가하면 시세가 표시돼요.';render();return}
 const my=++busy;
 try{
  const r=await fetch('/api/stocks',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(list.map(x=>({c:x.c,t:x.t,s:x.s})))});
  const j=await r.json();if(!r.ok)throw new Error(j.error);
  if(my!==busy)return;
  const m={};list.forEach(x=>m[x.c]=x);
  D=j.items.map(i=>({...i,n:(m[i.c]||{}).n||i.c,t:(m[i.c]||{}).t,s:(m[i.c]||{}).s}));
  D.forEach(d=>{if(!d.err){d.sc=score(d);d.best=Math.max(d.sc.day,d.sc.sw)}});
  const bad=D.filter(d=>d.err).length;
  st.className='';st.style.cssText='font-size:12px;color:var(--sub);margin:4px 0 12px';
  st.textContent='시세 갱신 '+new Date(j.asOf).toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false})+' · 30초마다 자동 갱신'+(bad?' · 조회 실패 '+bad+'종목':'');
  render();
 }catch(e){if(my===busy)st.textContent='데이터를 불러오지 못했어요: '+e.message}
}
function bind(id,key,set){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;set(b.dataset[key]);document.querySelectorAll('#'+id+' .chip').forEach(x=>x.setAttribute('aria-pressed',x===b));render()})}
bind('f','f',v=>F=v);bind('s','s',v=>S=v);
document.getElementById('g').addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 if(b.dataset.g!==undefined){G.cur=b.dataset.g;D=[];save();renderG();render();load();return}
 const a=b.dataset.a,names=Object.keys(G.groups);
 if(a==='new'){const n=(prompt('새 그룹 이름')||'').trim();if(!n)return;if(G.groups[n]){alert('같은 이름의 그룹이 있어요.');return}G.groups[n]=[];G.cur=n;D=[];save();renderG();render();load()}
 if(a==='ren'){const n=(prompt('그룹 이름 변경',G.cur)||'').trim();if(!n||n===G.cur)return;if(G.groups[n]){alert('같은 이름의 그룹이 있어요.');return}
  const g={};names.forEach(k=>{g[k===G.cur?n:k]=G.groups[k]});G.groups=g;G.cur=n;save();renderG()}
 if(a==='delg'){if(names.length<2){alert('그룹은 최소 1개가 필요해요.');return}
  if(!confirm('"'+G.cur+'" 그룹과 안의 종목을 삭제할까요?'))return;
  delete G.groups[G.cur];G.cur=Object.keys(G.groups)[0];D=[];save();renderG();render();load()}
});
document.getElementById('list').addEventListener('click',e=>{
 const m=e.target.closest('.mini'),r=e.target.closest('.row');
 if(m){
  const L=G.groups[G.cur],x=L.find(y=>y.c===m.dataset.c);if(!x)return;
  if(m.dataset.act==='del'){if(!confirm(x.n+'을(를) 삭제할까요?'))return;G.groups[G.cur]=L.filter(y=>y.c!==x.c);D=D.filter(d=>d.c!==x.c)}
  else{const t=prompt(x.n+' 테마 (예: 반도체 소부장)',x.t==='미분류'?'':x.t);if(t===null)return;
   const s=prompt('세부 분류 (예: 후공정 · 패키징)',x.s||'');x.t=t.trim()||'미분류';if(s!==null)x.s=s.trim();D.forEach(d=>{if(d.c===x.c){d.t=x.t;d.s=x.s}})}
  save();renderG();render();load();return;
 }
 if(!r)return;
 const c=r.dataset.c;open.has(c)?open.delete(c):open.add(c);r.classList.toggle('open');
});
document.getElementById('list').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('row'))e.target.click()});
const q=document.getElementById('q'),res=document.getElementById('res');let tm,qs=0;
q.addEventListener('input',()=>{clearTimeout(tm);const v=q.value.trim();if(!v){qs++;res.innerHTML='';return}tm=setTimeout(()=>doSearch(v),300)});
async function doSearch(v){
 const my=++qs;res.innerHTML='<div class="empty">검색 중…</div>';
 try{
  const r=await fetch('/api/search?q='+encodeURIComponent(v));const j=await r.json();if(my!==qs)return;
  if(!r.ok)throw new Error(j.error);
  const L=j.items||[],cur=G.groups[G.cur]||[];
  res.innerHTML=L.length?L.map(x=>{const has=cur.some(y=>y.c===x.c);return `<div class="sr" data-c="${esc(x.c)}" data-n="${esc(x.n)}"><span><b>${esc(x.n)}</b><i>${esc(x.c)} ${esc(x.m)}</i></span><span class="${has?'in':'add'}">${has?'추가됨':'+ 추가'}</span></div>`}).join(''):'<div class="empty">결과가 없어요. 6자리 종목코드로 검색해 보세요.</div>';
 }catch(e){if(my===qs)res.innerHTML='<div class="empty">검색 실패: '+esc(e.message)+'</div>'}
}
res.addEventListener('click',e=>{const r=e.target.closest('.sr');if(r)add(r.dataset.c,r.dataset.n)});
function add(c,n){
 const L=G.groups[G.cur];
 if(L.some(x=>x.c===c)){alert('이미 이 그룹에 있어요.');return}
 if(L.length>=40){alert('한 그룹에는 최대 40종목까지 담을 수 있어요.');return}
 const t=prompt(n+' 테마를 입력하세요 (예: 반도체 소부장). 건너뛰려면 취소','');
 const s=t?(prompt('세부 분류 (예: 후공정 · 패키징). 건너뛰려면 취소','')||''):'';
 L.push({c,n,t:(t||'').trim()||'미분류',s:s.trim()});
 save();renderG();q.value='';res.innerHTML='';load();
}
function tick(){
 const now=new Date();
 const k=new Date(now.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
 const day=k.getDay(),m=k.getHours()*60+k.getMinutes();
 const op=day>0&&day<6&&m>=540&&m<=930;
 const txt=now.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
 document.getElementById('clock').textContent=txt+' (KST) · '+(op?'정규장 진행 중':'정규장 마감');
}
tick();setInterval(tick,1000);
renderG();render();load();setInterval(load,30000);
</script>
</body>
</html>
